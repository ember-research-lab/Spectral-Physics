[project]
name = "spectral-physics"
version = "0.1.0"
description = "Companion code for Spectral Physics: A Unified Framework (v0.8)"
authors = [{ name = "Aaron Ben-Shalom", email = "aaron@ember-research.org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "networkx>=3.1",
    "pytest>=7.0",
]

[project.optional-dependencies]
cosmology = ["astropy>=5.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
